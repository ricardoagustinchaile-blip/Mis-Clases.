<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mis Clases"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Mis Clases</title>
<style>
:root{--blue:#2563eb;--bg:#f4f7fb;--text:#172033;--muted:#6b7280;--card:#fff;--green:#16803c;--orange:#c56a00;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:var(--blue);color:#fff;padding:20px 18px 18px;position:sticky;top:0;z-index:4}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;opacity:.88;font-size:14px}.content{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000a;border:1px solid #edf0f4}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:23px;font-weight:750;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.btn{border:0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;background:var(--blue);color:#fff}.btn.secondary{background:#e8eefc;color:#1e4fb6}.btn.danger{background:#fee2e2;color:#991b1b}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:650}.small{font-size:13px;color:var(--muted)}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.paid-cash{background:#dcfce7;color:var(--green)}.paid-transfer{background:#dbeafe;color:#1d4ed8}.pending{background:#ffedd5;color:var(--orange)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.navin{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none;border:0;padding:10px 4px 12px;color:#6b7280;font-size:12px}nav button.active{color:var(--blue);font-weight:750}nav .ico{font-size:20px;display:block;margin-bottom:2px}
input,select{width:100%;padding:13px;border:1px solid #d7dce5;border-radius:11px;font-size:16px;background:#fff}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.choice{display:grid;gap:8px}.choice label{margin:0;color:var(--text);font-size:15px;border:1px solid var(--line);padding:12px;border-radius:11px}.choice input{width:auto;margin-right:8px}.total{background:#eff6ff;border-radius:12px;padding:13px;margin-top:12px;font-weight:750}.empty{text-align:center;color:var(--muted);padding:28px 10px}.search{margin-bottom:10px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:720px;margin:auto;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:18px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px;width:560px}.content{padding:20px}}
</style></head>
<body><div class="app"><header class="top"><h1>📚 Mis Clases</h1><p id="subtitle">Gestión de clases y cobros</p></header><main class="content" id="screen"></main></div>
<nav><div class="navin"><button data-tab="home" onclick="go('home')"><span class="ico">🏠</span>Inicio</button><button data-tab="students" onclick="go('students')"><span class="ico">👥</span>Alumnos</button><button data-tab="classes" onclick="go('classes')"><span class="ico">📅</span>Clases</button><button data-tab="more" onclick="go('more')"><span class="ico">☰</span>Más</button></div></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='mis_clases_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{students:[],classes:[],prices:{home:10000,travel:22500}};
let tab='home';
let selectedMonth=new Date().toISOString().slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n)}
function dateISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('es-AR')}
function go(t){tab=t;render()}
function setActive(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){setActive();const s=document.getElementById('screen'); if(tab==='home')home(s); if(tab==='students')students(s); if(tab==='classes')classes(s); if(tab==='more')more(s)}
function monthClasses(){return db.classes.filter(c=>c.date.slice(0,7)===selectedMonth)}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}).replace(/^./,x=>x.toUpperCase())}
function changeMonth(delta){const [y,mo]=selectedMonth.split('-').map(Number);const d=new Date(y,mo-1+delta,1);selectedMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function monthPicker(){return '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px"><button class="btn secondary" style="padding:9px 13px" onclick="changeMonth(-1)">‹</button><b>📅 '+monthLabel(selectedMonth)+'</b><button class="btn secondary" style="padding:9px 13px" onclick="changeMonth(1)">›</button></div>'}
function home(s){const cs=monthClasses(),total=cs.reduce((a,c)=>a+c.amount,0),cash=cs.filter(c=>c.payment==='cash').reduce((a,c)=>a+c.amount,0),transfer=cs.filter(c=>c.payment==='transfer').reduce((a,c)=>a+c.amount,0),pending=cs.filter(c=>c.payment==='pending').reduce((a,c)=>a+c.amount,0);s.innerHTML=`${monthPicker()}<div class="grid"><div class="card stat"><div class="label">Total del mes</div><div class="value">${money(total)}</div></div><div class="card stat"><div class="label">Pendiente</div><div class="value">${money(pending)}</div></div><div class="card stat"><div class="label">Efectivo</div><div class="value">${money(cash)}</div></div><div class="card stat"><div class="label">Transferencias</div><div class="value">${money(transfer)}</div></div></div><div class="actions"><button class="btn" onclick="openClass()">＋ Registrar clase</button><button class="btn secondary" onclick="openStudent()">＋ Alumno</button></div><div class="card section"><h2>Resumen de ${monthLabel(selectedMonth)}</h2><div class="row"><span>Clases realizadas</span><b>${cs.length}</b></div><div class="row"><span>En mi casa</span><b>${cs.filter(c=>c.mode==='home').length}</b></div><div class="row"><span>A domicilio</span><b>${cs.filter(c=>c.mode==='travel').length}</b></div></div>`}
function students(s){s.innerHTML=`${monthPicker()}<div class="actions"><button class="btn" onclick="openStudent()">＋ Nuevo alumno</button></div><input class="search" id="search" placeholder="🔎 Buscar alumno..." oninput="renderStudents()"><div id="studentList"></div>`;renderStudents()}
function renderStudents(){const q=(document.getElementById('search')?.value||'').toLowerCase(),el=document.getElementById('studentList');if(!el)return;const arr=db.students.filter(x=>x.name.toLowerCase().includes(q));el.innerHTML=arr.length?arr.map(x=>`<div class="card row" onclick="studentDetail('${x.id}')"><div><div class="name">${esc(x.name)}</div><div class="small">${esc(x.subject||'Sin materia')}</div></div><div>›</div></div>`).join(''):`<div class="empty">Todavía no hay alumnos.</div>`}
function classes(s){const cs=[...db.classes].filter(c=>c.date.slice(0,7)===selectedMonth).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));s.innerHTML=`<div class="actions"><button class="btn" onclick="openClass()">＋ Registrar clase</button></div><div class="card">${cs.length?cs.map(c=>{const st=db.students.find(x=>x.id===c.studentId);return `<div class="row"><div><div class="name">${esc(st?.name||'Alumno eliminado')}</div><div class="small">${fmtDate(c.date)} · 🕐 ${c.time||'Sin horario'} · ${c.mode==='home'?'🏠 En mi casa · 1 h':'🚗 A domicilio · 1 h 30'}</div></div><div style="text-align:right"><b>${money(c.amount)}</b><br><span class="badge ${c.payment==='cash'?'paid-cash':c.payment==='transfer'?'paid-transfer':'pending'}">${c.payment==='cash'?'💵 Efectivo':c.payment==='transfer'?'🏦 Transferencia':'⏳ Pendiente'}</span><br><button class="btn secondary" style="padding:6px 9px;margin-top:6px;font-size:12px" onclick="openEditClass('${c.id}')">✏️ Editar</button></div></div>`}).join(''):`<div class="empty">No hay clases registradas.</div>`}</div>`}
function more(s){s.innerHTML=`<div class="card"><h2>Valores de las clases</h2><label>🏠 En mi casa · 1 hora</label><input id="pHome" type="number" value="${db.prices.home}"><label>🚗 A domicilio · 1 hora 30</label><input id="pTravel" type="number" value="${db.prices.travel}"><button class="btn" style="margin-top:14px;width:100%" onclick="savePrices()">Guardar valores</button></div><div class="card section"><h2>Datos</h2><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="exportData()">💾 Exportar copia de seguridad</button><button class="btn danger" style="width:100%" onclick="resetData()">Borrar todos los datos</button></div>`}
function savePrices(){db.prices.home=Number(document.getElementById('pHome').value)||0;db.prices.travel=Number(document.getElementById('pTravel').value)||0;save();alert('Valores guardados');render()}
function openStudent(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Nuevo alumno</h2><label>Nombre</label><input id="stName" placeholder="Ej. Juan Pérez"><label>Materia</label><input id="stSubject" placeholder="Ej. Matemática"><label>📱 Celular del alumno</label><input id="stPhone" type="tel" placeholder="Ej. 11 1234 5678"><label>👨‍👩‍👧 Celular de padre, madre o tutor</label><input id="stTutorPhone" type="tel" placeholder="Ej. 11 9876 5432"><button class="btn" style="width:100%;margin-top:16px" onclick="addStudent()">Guardar alumno</button>`;document.getElementById('modal').classList.remove('hidden');setTimeout(()=>document.getElementById('stName').focus(),50)}
function addStudent(){const name=document.getElementById('stName').value.trim();if(!name)return alert('Escribe el nombre del alumno.');db.students.push({id:crypto.randomUUID(),name,subject:document.getElementById('stSubject').value.trim(),phone:document.getElementById('stPhone').value.trim(),tutorPhone:document.getElementById('stTutorPhone').value.trim()});save();closeModal();render()}
function openEditStudent(id){const st=db.students.find(x=>x.id===id);if(!st)return;document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Editar alumno</h2><label>Nombre</label><input id="estName" value="${esc(st.name)}"><label>Materia</label><input id="estSubject" value="${esc(st.subject||'')}"><label>📱 Celular del alumno</label><input id="estPhone" type="tel" value="${esc(st.phone||'')}" placeholder="Ej. 11 1234 5678"><label>👨‍👩‍👧 Celular de padre, madre o tutor</label><input id="estTutorPhone" type="tel" value="${esc(st.tutorPhone||'')}" placeholder="Ej. 11 9876 5432"><button class="btn" style="width:100%;margin-top:16px" data-id="${id}" onclick="saveEditedStudent(this.dataset.id)">Guardar cambios</button>`;document.getElementById('modal').classList.remove('hidden');setTimeout(()=>document.getElementById('estName').focus(),50)}
function saveEditedStudent(id){const st=db.students.find(x=>x.id===id);if(!st)return;const name=document.getElementById('estName').value.trim();if(!name)return alert('Escribe el nombre del alumno.');st.name=name;st.subject=document.getElementById('estSubject').value.trim();st.phone=document.getElementById('estPhone').value.trim();st.tutorPhone=document.getElementById('estTutorPhone').value.trim();save();closeModal();render()}
function openClass(studentId=''){if(!db.students.length){alert('Primero agrega al menos un alumno.');go('students');return}const options=db.students.map(x=>`<option value="${x.id}" ${x.id===studentId?'selected':''}>${esc(x.name)}</option>`).join('');document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Registrar clase</h2><label>Alumno</label><select id="cStudent">${options}</select><label>Fecha</label><input id="cDate" type="date" value="${dateISO()}"><label>Hora de inicio</label><input id="cTime" type="time" value="09:00"><label>Modalidad</label><div class="choice"><label><input type="radio" name="mode" value="home" checked onchange="updateAmount()"> 🏠 En mi casa · 1 hora — ${money(db.prices.home)}</label><label><input type="radio" name="mode" value="travel" onchange="updateAmount()"> 🚗 A domicilio · 1 h 30 — ${money(db.prices.travel)}</label></div><div class="total">Importe: <span id="amount">${money(db.prices.home)}</span></div><label>Pago</label><div class="choice"><label><input type="radio" name="pay" value="cash" checked> 💵 Efectivo</label><label><input type="radio" name="pay" value="transfer"> 🏦 Transferencia</label><label><input type="radio" name="pay" value="pending"> ⏳ Pendiente</label></div><button class="btn" style="width:100%;margin-top:16px" onclick="addClass()">Guardar clase</button>`;document.getElementById('modal').classList.remove('hidden')}
function openEditClass(id){const c=db.classes.find(x=>x.id===id);if(!c)return;const options=db.students.map(x=>'<option value="'+x.id+'" '+(x.id===c.studentId?'selected':'')+'>'+esc(x.name)+'</option>').join('');document.getElementById('sheet').innerHTML='<button class="close" onclick="closeModal()">×</button><h2>Editar clase</h2><label>Alumno</label><select id="eStudent">'+options+'</select><label>Fecha</label><input id="eDate" type="date" value="'+c.date+'"><label>Hora de inicio</label><input id="eTime" type="time" value="'+(c.time||'09:00')+'"><label>Modalidad</label><div class="choice"><label><input type="radio" name="emode" value="home" '+(c.mode==='home'?'checked':'')+ ' onchange="updateEditAmount()"> 🏠 En mi casa · 1 hora — '+money(db.prices.home)+'</label><label><input type="radio" name="emode" value="travel" '+(c.mode==='travel'?'checked':'')+ ' onchange="updateEditAmount()"> 🚗 A domicilio · 1 h 30 — '+money(db.prices.travel)+'</label></div><div class="total">Importe: <span id="editAmount">'+money(c.amount)+'</span></div><label>Pago</label><div class="choice"><label><input type="radio" name="epay" value="cash" '+(c.payment==='cash'?'checked':'')+'> 💵 Efectivo</label><label><input type="radio" name="epay" value="transfer" '+(c.payment==='transfer'?'checked':'')+'> 🏦 Transferencia</label><label><input type="radio" name="epay" value="pending" '+(c.payment==='pending'?'checked':'')+'> ⏳ Pendiente</label></div><button class="btn" style="width:100%;margin-top:16px" data-id="'+id+'" onclick="saveEditedClass(this.dataset.id)">Guardar cambios</button>';document.getElementById('modal').classList.remove('hidden')}
function updateEditAmount(){const mode=document.querySelector('input[name=emode]:checked').value;document.getElementById('editAmount').textContent=money(mode==='home'?db.prices.home:db.prices.travel)}
function saveEditedClass(id){const c=db.classes.find(x=>x.id===id);if(!c)return;const oldMode=c.mode,newMode=document.querySelector('input[name=emode]:checked').value;c.studentId=document.getElementById('eStudent').value;c.date=document.getElementById('eDate').value;c.time=document.getElementById('eTime').value;c.mode=newMode;c.payment=document.querySelector('input[name=epay]:checked').value;if(oldMode!==newMode)c.amount=newMode==='home'?db.prices.home:db.prices.travel;save();closeModal();selectedMonth=c.date.slice(0,7);go('classes')}
function updateAmount(){const mode=document.querySelector('input[name=mode]:checked').value;document.getElementById('amount').textContent=money(mode==='home'?db.prices.home:db.prices.travel)}
function addClass(){const mode=document.querySelector('input[name=mode]:checked').value,pay=document.querySelector('input[name=pay]:checked').value;db.classes.push({id:crypto.randomUUID(),studentId:document.getElementById('cStudent').value,date:document.getElementById('cDate').value,time:document.getElementById('cTime').value,mode,payment:pay,amount:mode==='home'?db.prices.home:db.prices.travel});save();closeModal();go('classes')}
function studentDetail(id){const st=db.students.find(x=>x.id===id),cs=db.classes.filter(c=>c.studentId===id).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));if(!st)return;const total=cs.reduce((a,c)=>a+c.amount,0),pending=cs.filter(c=>c.payment==='pending').reduce((a,c)=>a+c.amount,0);document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${esc(st.name)}</h2><div class="small">${esc(st.subject||'Sin materia')}</div><div class="card" style="margin-top:12px"><div class="small">📱 Celular del alumno</div><div>${esc(st.phone||'No registrado')}</div><div class="small" style="margin-top:9px">👨‍👩‍👧 Celular de padre, madre o tutor</div><div>${esc(st.tutorPhone||'No registrado')}</div></div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="openEditStudent('${id}')">✏️ Editar alumno</button><button class="btn" onclick="closeModal();openClass('${id}')">＋ Registrar clase</button></div><div class="total">Total histórico: ${money(total)} · Pendiente: ${money(pending)}</div><div>${cs.length?cs.map(c=>`<div class="row"><div><b>${fmtDate(c.date)} · 🕐 ${c.time||'Sin horario'}</b><div class="small">${c.mode==='home'?'🏠 En mi casa · 1 h':'🚗 A domicilio · 1 h 30'}</div></div><div style="text-align:right"><b>${money(c.amount)}</b><br><span class="badge ${c.payment==='cash'?'paid-cash':c.payment==='transfer'?'paid-transfer':'pending'}">${c.payment==='cash'?'Efectivo':c.payment==='transfer'?'Transferencia':'Pendiente'}</span></div></div>`).join(''):`<div class="empty">Todavía no hay clases.</div>`}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-clases-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('¿Borrar todos los alumnos y clases? Esta acción no se puede deshacer.')){db={students:[],classes:[],prices:{home:10000,travel:22500}};save();render()}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
